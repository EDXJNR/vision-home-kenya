<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Detail — Vision Homes Kenya</title>
  <meta name="description" content="Full property details, photos and contact — Vision Homes Kenya.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hero.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Theme: apply saved theme before first paint to avoid flash -->
  <script>
  (function(){
    var root = document.documentElement;
    root.classList.add('no-transition');
    var t = localStorage.getItem('vhk-theme');
    if (t === 'light') root.setAttribute('data-theme', 'light');
    window.addEventListener('load', function () {
      root.classList.remove('no-transition');
    });
  })();
  </script>

  <style>
    /* ── LAYOUT ── */
    .prop-detail-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 2rem 64px;
    }
    .prop-detail-main { padding-right: 48px; }

    /* ── GALLERY ── */
    .gallery {
      width: 100%;
      margin-bottom: 32px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--bg2);
      border: 0.5px solid var(--border);
    }

    .gallery-main {
      width: 100%;
      height: 420px;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    .gallery-placeholder {
      width: 100%;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      border: 0.5px solid rgba(255,255,255,0.15);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      font-size: 18px;
      transition: background 0.2s;
    }
    .gallery-arrow:hover { background: rgba(201,169,110,0.75); }
    .gallery-arrow.prev { left: 14px; }
    .gallery-arrow.next { right: 14px; }

    .gallery-counter {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 2px;
      z-index: 2;
    }

    .gallery-thumbs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .gallery-thumbs::-webkit-scrollbar { display: none; }

    .gallery-thumb {
      width: 80px;
      height: 56px;
      flex-shrink: 0;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.5;
      border-radius: 2px;
      transition: opacity 0.2s;
      border: 1.5px solid transparent;
    }
    .gallery-thumb.active,
    .gallery-thumb:hover { opacity: 1; border-color: var(--gold); }

    /* ── BREADCRUMB / INFO ── */
    .prop-breadcrumb {
      font-size: 11px;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prop-breadcrumb a { color: var(--text-faint); text-decoration: none; transition: color 0.2s; }
    .prop-breadcrumb a:hover { color: var(--gold); }

    .prop-detail-hood {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prop-detail-hood::before {
      content: '';
      display: block;
      width: 20px;
      height: 0.5px;
      background: var(--gold);
    }

    .prop-detail-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .prop-detail-title {
      font-size: 16px;
      color: var(--text-dim);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .prop-detail-specs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 36px;
    }
    .spec-item { background: var(--bg2); padding: 18px 20px; text-align: center; transition: background 0.3s; }
    .spec-val { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .spec-key { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }

    .prop-section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .prop-section-title::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }

    .prop-desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.9;
      margin-bottom: 36px;
    }

    .prop-features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 36px;
    }
    .prop-feature { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
    .prop-feature i { color: var(--gold); font-size: 14px; width: 18px; text-align: center; }

    /* ── MAP ── */
    .prop-map-wrap {
      margin-bottom: 36px;
    }

    #property-map {
      width: 100%;
      height: 280px;
      border-radius: 3px;
      border: 0.5px solid var(--border);
      z-index: 1;
    }

    .prop-map-no-coords {
      height: 120px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-faint);
      font-size: 13px;
      gap: 8px;
    }

    .map-disclaimer {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ── SIDEBAR ── */
    .prop-detail-sidebar { position: sticky; top: 80px; align-self: start; }

    .enquiry-card {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 28px 24px;
      margin-bottom: 16px;
      transition: background 0.3s;
    }
    .enquiry-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 20px;
    }

    .enquiry-form label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .enquiry-form input,
    .enquiry-form textarea {
      width: 100%;
      background: var(--input-bg);
      border: 0.5px solid var(--input-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 3px;
      font-size: 13px;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, background 0.3s;
      resize: none;
    }
    .enquiry-form input:focus,
    .enquiry-form textarea:focus { border-color: rgba(201,169,110,0.45); }
    .enquiry-form textarea { height: 90px; }

    .enquiry-form-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }

    /* Success state */
    .enquiry-success {
      display: none;
      text-align: center;
      padding: 20px 0 8px;
    }
    .enquiry-success-icon { font-size: 36px; color: var(--gold); margin-bottom: 12px; }
    .enquiry-success-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--text); margin-bottom: 8px; }
    .enquiry-success-sub { font-size: 12px; color: var(--text-dim); line-height: 1.65; margin-bottom: 16px; }

    .agent-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 3px;
      transition: background 0.3s;
    }
    .agent-mini-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--gold); display: flex; align-items: center;
      justify-content: center; font-family: 'Cormorant Garamond', serif;
      font-size: 15px; font-weight: 600; color: var(--bg); flex-shrink: 0;
    }
    .agent-mini-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .agent-mini-role { font-size: 11px; color: var(--text-faint); }

    .prop-detail-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 5px 12px; border-radius: 2px; margin-bottom: 16px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .prop-detail-layout { grid-template-columns: 1fr; padding: 20px 16px 48px; }
      .prop-detail-main { padding-right: 0; }
      .gallery-main { height: 260px; }
      .gallery-placeholder { height: 260px; }
      .prop-detail-price { font-size: 28px; }
      .prop-detail-sidebar { position: static; }
      .prop-features-grid { grid-template-columns: 1fr; }
      #property-map { height: 220px; }
    }

    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <div id="prop-content">
    <div style="padding:80px 2rem;text-align:center;color:var(--text-dim);">
      <div style="font-size:32px;margin-bottom:12px;color:var(--gold);opacity:.5;">
        <i class="ti ti-loader" style="animation:spin 1s linear infinite;display:inline-block;"></i>
      </div>
      <div style="font-size:14px;">Loading property…</div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/newsletter.js"></script>
  <script src="js/theme.js" defer></script>

  <script>
    // ── Apply saved theme before render (prevents flash) ──
    (function(){
      var t = localStorage.getItem('vhk-theme');
      if(t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();

    function loadComponent(id, file) {
      fetch(file).then(r => r.text()).then(html => {
        document.getElementById(id).innerHTML = html;
      }).catch(() => {});
    }
    loadComponent('nav-placeholder', 'components/nav.html');
    loadComponent('footer-placeholder', 'components/footer.html');

    // ── GALLERY STATE ──
    let galleryImages = [];
    let galleryIndex  = 0;
    let leafletMap    = null;

    function galleryGo(index) {
      if (!galleryImages.length) return;
      galleryIndex = (index + galleryImages.length) % galleryImages.length;
      const mainImg = document.getElementById('gallery-main-img');
      const counter = document.getElementById('gallery-counter');
      const thumbs  = document.querySelectorAll('.gallery-thumb');
      if (mainImg) {
        mainImg.style.opacity = '0';
        setTimeout(() => { mainImg.src = galleryImages[galleryIndex]; mainImg.style.opacity = '1'; }, 200);
      }
      if (counter) counter.textContent = `${galleryIndex + 1} / ${galleryImages.length}`;
      thumbs.forEach((t, i) => t.classList.toggle('active', i === galleryIndex));
      // Scroll active thumb into view
      if (thumbs[galleryIndex]) thumbs[galleryIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function buildGallery(images, neighborhood, title) {
      // images = p.property_images array [{id, url, sort_order}]
      if (!images || images.length === 0) {
        return `<div class="gallery-placeholder" style="background:${getGradient(neighborhood)}">${getPlaceholderSVG(neighborhood)}</div>`;
      }

      galleryImages = images.map(img => img.url);
      galleryIndex  = 0;

      const thumbsHTML = galleryImages.length > 1
        ? `<div class="gallery-thumbs" id="gallery-thumbs-strip">
            ${galleryImages.map((url, i) =>
              `<img class="gallery-thumb ${i === 0 ? 'active' : ''}" src="${url}" alt="Photo ${i+1}" onclick="galleryGo(${i})">`
            ).join('')}
          </div>`
        : '';

      const arrowsHTML = galleryImages.length > 1
        ? `<button class="gallery-arrow prev" onclick="galleryGo(galleryIndex - 1)"><i class="ti ti-chevron-left"></i></button>
           <button class="gallery-arrow next" onclick="galleryGo(galleryIndex + 1)"><i class="ti ti-chevron-right"></i></button>`
        : '';

      return `
        <div class="gallery">
          <div class="gallery-main">
            <img id="gallery-main-img" src="${galleryImages[0]}" alt="${title}">
            ${arrowsHTML}
            ${galleryImages.length > 1 ? `<div class="gallery-counter" id="gallery-counter">1 / ${galleryImages.length}</div>` : ''}
          </div>
          ${thumbsHTML}
        </div>`;
    }

    // ── LEAFLET MAP ──
    function buildMap(lat, lng, title, neighborhood) {
      if (!lat || !lng) {
        return `<div class="prop-map-wrap">
          <div class="prop-section-title">Location</div>
          <div class="prop-map-no-coords">
            <i class="ti ti-map-pin"></i> ${neighborhood}, Nairobi, Kenya
          </div>
          <p class="map-disclaimer">Exact location provided upon confirmed viewing appointment.</p>
        </div>`;
      }

      return `<div class="prop-map-wrap">
        <div class="prop-section-title">Location</div>
        <div id="property-map"></div>
        <p class="map-disclaimer">Approximate location shown. Exact address shared upon confirmed appointment.</p>
      </div>`;
    }

    function initLeafletMap(lat, lng, title, neighborhood) {
      if (!lat || !lng) return;
      const mapEl = document.getElementById('property-map');
      if (!mapEl || leafletMap) return;

      const isLight = document.documentElement.getAttribute('data-theme') === 'light';

      leafletMap = L.map('property-map', {
        center: [lat, lng],
        zoom: 15,
        scrollWheelZoom: false,
        zoomControl: true,
      });

      // Use OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
      }).addTo(leafletMap);

      // Custom gold marker
      const goldIcon = L.divIcon({
        className: '',
        html: `<div style="
          width:36px;height:36px;border-radius:50% 50% 50% 0;
          background:${isLight ? '#a07840' : '#c9a96e'};
          border:3px solid ${isLight ? '#faf9f7' : '#0a0a0a'};
          transform:rotate(-45deg);
          box-shadow:0 2px 8px rgba(0,0,0,0.35);
        "></div>`,
        iconSize: [36, 36],
        iconAnchor: [18, 36],
        popupAnchor: [0, -38],
      });

      const marker = L.marker([lat, lng], { icon: goldIcon }).addTo(leafletMap);
      marker.bindPopup(`
        <div style="font-family:'DM Sans',sans-serif;padding:4px 0;">
          <div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;">${neighborhood}</div>
          <div style="font-size:13px;font-weight:500;color:var(--text);">${title}</div>
        </div>
      `, { maxWidth: 200 }).openPopup();

      // Re-apply tile filter when theme changes
      const observer = new MutationObserver(() => {
        leafletMap.invalidateSize();
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    // ── ENQUIRY SUBMIT ──
    async function submitEnquiry(title, hood, price) {
      const name  = document.getElementById('eq-name').value.trim();
      const phone = document.getElementById('eq-phone').value.trim();
      const email = document.getElementById('eq-email').value.trim();
      const msg   = document.getElementById('eq-msg').value.trim();

      if (!name || !phone) { alert('Please enter your name and phone number.'); return; }

      const btn = document.getElementById('enquiry-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;display:inline-block;"></i> Sending…';

      try {
        const db = getDB();
        if (db) {
          await db.from('enquiries').insert({
            name,
            phone,
            whatsapp: phone,
            type: 'property',
            property_title: title,
            subject: `Viewing request: ${title}`,
            message: msg || `Interested in ${title} (${hood}) at ${price}. Please contact me.`,
          });
        }
      } catch(e) { console.warn('Enquiry DB insert failed:', e); }

      // Show success state
      document.getElementById('enquiry-form-inner').style.display = 'none';
      document.getElementById('enquiry-success').style.display = 'block';

      // Auto-open WhatsApp
      const waText = encodeURIComponent(`Hi, I'm ${name} (${phone}). I'm interested in: ${title} (${hood}) at ${price}. ${msg ? 'Message: ' + msg : ''}`);
      window.open(`https://wa.me/${WA_NUMBER}?text=${waText}`, '_blank');
    }

    // ── INIT PAGE ──
    async function initPropertyPage() {
      await loadProperties();
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const p  = allProperties.find(x => x.id === id);

      if (!p) {
        document.getElementById('prop-content').innerHTML = `
          <div style="padding:80px 2rem;text-align:center;">
            <div style="font-size:32px;margin-bottom:16px;color:var(--gold)"><i class="ti ti-home-off"></i></div>
            <div style="font-size:20px;font-family:'Cormorant Garamond',serif;color:var(--text);margin-bottom:10px;">Property Not Found</div>
            <div style="font-size:13px;color:var(--text-dim);margin-bottom:24px;">This listing may have been removed or the link is incorrect.</div>
            <a class="btn-gold" href="listings.html"><i class="ti ti-arrow-left"></i> Back to Listings</a>
          </div>`;
        return;
      }

      document.title = `${p.title} — Vision Homes Kenya`;

      const galleryHTML  = buildGallery(p.property_images, p.neighborhood, p.title);
      const mapHTML      = buildMap(p.lat, p.lng, p.title, p.neighborhood);
      const waMsg        = encodeURIComponent(`Hi, I'm interested in: ${p.title} (${p.neighborhood}) at ${p.price}`);

      const features = [
        p.beds  ? `<div class="prop-feature"><i class="ti ti-bed"></i> ${p.beds} Bedrooms</div>` : '',
        p.baths ? `<div class="prop-feature"><i class="ti ti-bath"></i> ${p.baths} Bathrooms</div>` : '',
        p.size  ? `<div class="prop-feature"><i class="ti ti-ruler-measure"></i> ${p.size}</div>` : '',
        `<div class="prop-feature"><i class="ti ti-map-pin"></i> ${p.neighborhood}, Nairobi</div>`,
        `<div class="prop-feature"><i class="ti ti-shield-check"></i> Verified Listing</div>`,
        `<div class="prop-feature"><i class="ti ti-key"></i> ${p.type === 'rent' ? 'Available to Rent' : 'Available to Buy'}</div>`,
        `<div class="prop-feature"><i class="ti ti-home"></i> Residential Property</div>`,
        `<div class="prop-feature"><i class="ti ti-star"></i> Premium Location</div>`,
      ].join('');

      const specsHTML = [
        p.beds  ? `<div class="spec-item"><div class="spec-val">${p.beds}</div><div class="spec-key">Bedrooms</div></div>` : '',
        p.baths ? `<div class="spec-item"><div class="spec-val">${p.baths}</div><div class="spec-key">Bathrooms</div></div>` : '',
        p.size  ? `<div class="spec-item"><div class="spec-val" style="font-size:16px">${p.size}</div><div class="spec-key">Floor Area</div></div>` : '',
      ].filter(Boolean).join('');

      document.getElementById('prop-content').innerHTML = `
        <div class="prop-detail-layout">

          <!-- LEFT COLUMN -->
          <div class="prop-detail-main">

            <div class="prop-breadcrumb">
              <a href="index.html">Home</a>
              <i class="ti ti-chevron-right" style="font-size:10px;"></i>
              <a href="listings.html">Listings</a>
              <i class="ti ti-chevron-right" style="font-size:10px;"></i>
              <span style="color:var(--text-dim)">${p.neighborhood}</span>
            </div>

            ${galleryHTML}

            <span class="prop-detail-badge ${p.type === 'rent' ? 'badge-r' : 'badge-s'}">
              ${p.type === 'rent' ? '<i class="ti ti-key"></i> For Rent' : '<i class="ti ti-tag"></i> For Sale'}
            </span>

            <div class="prop-detail-hood">${p.neighborhood}</div>
            <div class="prop-detail-price">${p.price}</div>
            <div class="prop-detail-title">${p.title}</div>

            ${specsHTML ? `<div class="prop-detail-specs">${specsHTML}</div>` : ''}

            <div class="prop-section-title">About this property</div>
            <div class="prop-desc">${p.description || 'Contact us for more details about this exceptional property in ' + p.neighborhood + '.'}</div>

            <div class="prop-section-title">Features &amp; Amenities</div>
            <div class="prop-features-grid">${features}</div>

            ${mapHTML}

            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
              <a class="btn-gold" href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank"><i class="ti ti-brand-whatsapp"></i> Enquire on WhatsApp</a>
              <a class="btn-outline-w" href="contact.html"><i class="ti ti-calendar"></i> Book a Viewing</a>
              <a class="btn-outline-w" href="listings.html"><i class="ti ti-arrow-left"></i> Back to Listings</a>
            </div>
          </div>

          <!-- RIGHT SIDEBAR -->
          <aside class="prop-detail-sidebar">
            <div class="enquiry-card">
              <div class="enquiry-card-title">Enquire About This Property</div>

              <!-- FORM -->
              <div id="enquiry-form-inner">
                <div class="enquiry-form">
                  <label for="eq-name">Full Name *</label>
                  <input type="text" id="eq-name" placeholder="Your name">
                  <label for="eq-phone">Phone / WhatsApp *</label>
                  <input type="tel" id="eq-phone" placeholder="+254 700 000 000">
                  <label for="eq-email">Email Address</label>
                  <input type="email" id="eq-email" placeholder="you@example.com">
                  <label for="eq-msg">Message</label>
                  <textarea id="eq-msg">I'm interested in this property and would like to arrange a viewing.</textarea>
                  <div class="enquiry-form-actions">
                    <button id="enquiry-submit-btn" class="btn-gold" style="width:100%;justify-content:center;"
                      onclick="submitEnquiry(${JSON.stringify(p.title)}, ${JSON.stringify(p.neighborhood)}, ${JSON.stringify(p.price)})">
                      <i class="ti ti-send"></i> Send Enquiry
                    </button>
                    <a class="btn-outline-w" style="justify-content:center;"
                      href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank">
                      <i class="ti ti-brand-whatsapp"></i> WhatsApp Instead
                    </a>
                  </div>
                </div>
              </div>

              <!-- SUCCESS STATE -->
              <div class="enquiry-success" id="enquiry-success">
                <div class="enquiry-success-icon"><i class="ti ti-circle-check"></i></div>
                <div class="enquiry-success-title">Message Received</div>
                <p class="enquiry-success-sub">Thank you! A Vision Homes agent will be in touch shortly.<br><br>We've also opened WhatsApp for an instant response.</p>
                <a class="btn-gold" href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank" style="width:100%;justify-content:center;margin-top:4px;">
                  <i class="ti ti-brand-whatsapp"></i> Open WhatsApp
                </a>
              </div>
            </div>

            <div class="agent-mini">
              <div class="agent-mini-avatar">PA</div>
              <div>
                <div class="agent-mini-name">Phoebe Akinyi</div>
                <div class="agent-mini-role">Client Relations — responds within 1hr</div>
              </div>
            </div>
          </aside>
        </div>`;

      // Init Leaflet map after DOM is ready
      setTimeout(() => initLeafletMap(p.lat, p.lng, p.title, p.neighborhood), 100);

      // Keyboard nav for gallery
      document.addEventListener('keydown', function(e) {
        if (galleryImages.length < 2) return;
        if (e.key === 'ArrowLeft')  galleryGo(galleryIndex - 1);
        if (e.key === 'ArrowRight') galleryGo(galleryIndex + 1);
      });
    }

    document.addEventListener('DOMContentLoaded', initPropertyPage);
  </script>
</body>
</html>
